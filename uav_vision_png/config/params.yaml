uav_vision_png:
  ros__parameters:
    # ---- 相机内参（IMX214 可见光相机，双目 OAK-D Lite）----
    # SDF: horizontal_fov=1.204 rad, image=1920x1080
    # focal_length = (width/2) / tan(fov/2) = 960 / tan(0.602) = 1397.2 px
    focal_length: 1397.2
    image_width:  1920
    image_height: 1080

    # ---- 离散 LOS 增量导引参数 ----
    # kv/kz 分别作用于垂直/水平 LOS 角增量。
    kv: 4.0
    kz: 4.0

    # 期望冲击速度上限 (m/s)
    speed_cmd: 5.0

    # 速度增量增益
    d_gain: 2.0

    # ---- FOV 保持器（主动偏航跟踪）----
    # 将像素误差 ex 转化为偏航角速率 [rad/s]。
    k1_yaw: 0.0008
    k2_yaw: 0.0002

    # ---- 垂直视场补偿 ----
    # ey<0 表示目标在画面上方，vz_cmd += k_ey * ey。
    k_ey: 0.0056
    # Guidance input. truth_los is diagnostic-only SITL GPS geometry.
    guidance_source: "vision"
    # Original camera stamp domain; Gazebo sim/system pairs are mapped explicitly.
    image_time_domain: "gazebo"
    # Undo SITL DDS output offset, then use the native Gazebo clock mapping.
    px4_time_domain: "gazebo_dds"
    # Image-epoch quaternion SLERP. false is the explicit receipt-pose A/B control.
    attitude_sync: true
    # P2 single-variable A/B. Raw remains default until flight evidence supports KF.
    pixel_estimator: "raw"
    pixel_measurement_std: 4.0       # pixels; same for YOLO/LightTrack in P2
    pixel_acceleration_std: 1000.0   # pixels/s^2
    pixel_prediction_horizon: 0.3    # seconds; reject longer forecasts


    # ---- 起飞参数 ----
    # NED z（负值 = 上升），目标待机高度 5m
    standby_altitude: -6.0
    # Optional first-INTERCEPT release on /experiment/start (std_msgs/Bool).
    require_experiment_start: false
    takeoff_altitude_tolerance: 0.5  # m; strictly positive
    takeoff_speed_tolerance: 0.0     # m/s; zero disables the speed check
    takeoff_settle_time: 0.0         # continuous ROS seconds in tolerance
    # Optional standby_yaw (radians NED); omitted/NaN preserves legacy heading.
    # Experiments override tolerances to 0.08 m / 0.2 m/s, settling to 2 s.

    # ---- 视觉观测超时（秒；从最后有效检测的接收时刻起算）----
    # 明确无目标立即 COAST；完全不发消息也会按时间进入 COAST / TRACK_LOST。
    freshness_timeout: 0.15
    track_lost_timeout: 0.6

    # ---- GPS 命中评估（不参与视觉导引；记录由独立 recorder 负责）----
    # 命中判定半径 (m)
    hit_radius: 0.8
